name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes screenshots to the `screenshots` branch
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Unit, UI (Robolectric) and screenshot tests
        run: ./gradlew --no-daemon testDebugUnitTest -Proborazzi.test.record=true
      - name: Build debug and release APKs
        env:
          REELWISE_KEYSTORE_B64: ${{ secrets.REELWISE_KEYSTORE_B64 }}
          REELWISE_KEYSTORE_PASSWORD: ${{ secrets.REELWISE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$REELWISE_KEYSTORE_B64" ]; then
            echo "$REELWISE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/reelwise.jks"
            export REELWISE_KEYSTORE_FILE="$RUNNER_TEMP/reelwise.jks"
          fi
          ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/app/build/outputs/apk/**/*.apk
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports
            android/app/build/test-results
      # Last step: it replaces the working tree. Screenshots of main feed the README; other
      # branches publish to their own branch. The release APK (no keys inside: they are entered
      # in the app) goes to apk-<branch>, so a phone can download it from a plain link.
      - name: Publish screenshots and the release APK
        if: github.event_name == 'push'
        working-directory: .
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          shots_branch=$([ "$branch" = "main" ] && echo screenshots || echo "screenshots-$branch")
          out=$(mktemp -d)
          mkdir -p "$out/shots" "$out/apk"
          cp android/app/build/outputs/roborazzi/*.png "$out/shots"/
          cp android/app/build/outputs/apk/release/app-release.apk "$out/apk/reelwise-$branch.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() { # $1 = source dir, $2 = branch
            git checkout -q --orphan "publish-$2"
            git rm -rfq . > /dev/null
            git clean -fdxq
            cp "$1"/* .
            git add -A
            git commit -qm "Build ${GITHUB_SHA::7}"
            git push -qf origin "HEAD:$2"
          }
          publish "$out/shots" "$shots_branch"
          publish "$out/apk" "apk-$branch"
