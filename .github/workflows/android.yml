name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes screenshots to the `screenshots` branch
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      # Set the repository variable API_BASE_URL to your deployed backend to get an APK that works outside the emulator.
      API_BASE_URL: ${{ vars.API_BASE_URL || 'http://10.0.2.2:8000/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew --no-daemon lintDebug -PapiBaseUrl="$API_BASE_URL"
      - name: Unit, UI (Robolectric) and screenshot tests
        run: ./gradlew --no-daemon testDebugUnitTest -Proborazzi.test.record=true -PapiBaseUrl="$API_BASE_URL"
      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease -PapiBaseUrl="$API_BASE_URL"
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/app/build/outputs/apk/**/*.apk
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports
            android/app/build/test-results
      # Last step: it replaces the working tree. Keeps the README's screenshots current.
      - name: Publish screenshots to the screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          shots=$(mktemp -d)
          cp android/app/build/outputs/roborazzi/*.png "$shots"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots-publish
          git rm -rfq .
          cp "$shots"/*.png .
          git add -- *.png
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f origin HEAD:screenshots
