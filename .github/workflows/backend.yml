name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  evaluate:
    # The recommender must beat the popularity and item-kNN baselines on held-out MovieLens data.
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements.txt
      - name: Offline evaluation on MovieLens (ml-latest-small)
        run: python -m recsys.evaluate --dataset ml-latest-small --out reports/ci --require-hybrid-wins
      - name: Publish report to the run summary
        if: always()
        run: cat reports/ci/eval-ml-latest-small.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: backend/reports/ci

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (downloads MovieLens and trains the model)
        run: docker build -t movie-recs-api backend
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 -e TMDB_API_KEY=dummy movie-recs-api
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/health | grep '"offline_model":true'

  huggingface-image:
    # The Hugging Face Space builds from deploy/huggingface/Dockerfile; prove it works before anyone pastes it.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Space image (clones main from GitHub)
        run: docker build -t space-api deploy/huggingface
      - name: Smoke test on the Space port
        run: |
          docker run -d --name space -p 7860:7860 -e TMDB_API_KEY=dummy space-api
          for i in $(seq 1 30); do curl -fsS localhost:7860/health && break; sleep 2; done
          curl -fsS localhost:7860/health | grep '"offline_model":true'
